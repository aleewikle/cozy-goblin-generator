<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cozy Goblin Generator</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #e9ead8; color: #344631; font-family: Georgia, serif; }
    main { width: min(100%, 650px); background: #fffaf0; padding: 36px; border: 3px solid #859476; border-radius: 22px; box-shadow: 8px 9px 0 #cad0b5; text-align: center; }
    .mushroom { font-size: 54px; margin: 0; }
    h1 { font-size: clamp(30px, 6vw, 46px); margin: 8px 0; }
    .intro { line-height: 1.5; color: #69745a; }
    button { border: 0; border-radius: 12px; background: #a95543; color: white; padding: 15px 24px; font: bold 17px Georgia, serif; cursor: pointer; margin: 15px 0; }
    button:hover { background: #853c30; }
    button:focus-visible { outline: 3px solid #344631; outline-offset: 4px; }
    .card { background: #f0efdc; border: 1px solid #d4d3b7; border-radius: 14px; padding: 24px; margin-top: 18px; text-align: left; }
    .portrait { display: block; width: min(100%, 250px); margin: 0 auto 18px; border-radius: 18px; background: #e2e8cf; border: 2px solid #b4bea1; }
    .portrait-caption { text-align: center; font-size: 13px; color: #69745a; margin: -7px 0 15px; }
    .card h2 { margin: 0 0 15px; text-align: center; font-size: 32px; }
    .card p { line-height: 1.6; margin: 12px 0; }
    .footer { font-size: 13px; color: #7c846c; margin-top: 22px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="mushroom" aria-hidden="true">🍄🌿</p>
    <h1>The Cozy Goblin Generator</h1>
    <p class="intro">Deep in the mossy woods, a very official goblin registry awaits. Discover your goblin self!</p>
    <button id="generate" type="button">Discover Your Goblin Self ✨</button>
    <section id="result" class="card" aria-live="polite" hidden>
      <svg id="portrait" class="portrait" viewBox="0 0 240 240" role="img" aria-label="A randomly illustrated woodland goblin portrait" xmlns="http://www.w3.org/2000/svg"></svg>
      <p class="portrait-caption">A freshly discovered forest resident</p>
      <h2 id="goblin-name"></h2>
      <p><strong>🌱 Woodland occupation:</strong> <span id="job"></span></p>
      <p><strong>🔮 Magical possession:</strong> <span id="item"></span></p>
      <p><strong>🐸 Personality:</strong> <span id="personality"></span></p>
    </section>
    <p class="footer">Made with moss, mushrooms, and questionable magic.</p>
  </main>
  <script>
    const firstNames = ["Boggle", "Thistle", "Mossy", "Pip", "Nettle", "Wizzle", "Cricket", "Fern"];
    const lastNames = ["Fernwhistle", "Mudbottom", "Toadstool", "Bogsniffer", "Mossbucket", "Crumbsnatch", "Twiggle", "Puddlefoot"];
    const jobs = ["Assistant Cloud Taster", "Mushroom Tax Collector", "Professional Puddle Inspector", "Keeper of Suspicious Jars", "Acorn Librarian", "Chief Moss Fluffer", "Frog Negotiator"];
    const items = ["a cursed teaspoon", "a very judgmental frog", "one enchanted acorn, currently on its lunch break", "a pebble of questionable importance", "a tiny hat for emergencies", "a jar of moonlight", "three mysterious buttons"];
    const personalities = ["Surprisingly nimble for someone carrying so many emergency crumbs.", "Believes every problem can be solved with soup.", "Collects shiny things and refuses to explain why.", "Has strong opinions about the correct way to greet a mushroom.", "Friendly, unless you insult their favorite puddle.", "Once challenged a squirrel to a duel and lost gracefully."];
    const pick = list => list[Math.floor(Math.random() * list.length)];
    // Draw a new original goblin portrait using SVG, with no external images or APIs.
    function drawGoblin() {
      const skin = pick(["#83a866", "#a3b979", "#8cb6b6", "#b4a0c5", "#d0b474"]);
      const hat = pick(["#a34f43", "#667c56", "#8b6b9a", "#b17b4c"]);
      const cloak = pick(["#526c55", "#8b6956", "#637a91", "#80677e"]);
      const eye = pick(["#342f2a", "#654b32", "#2f5262"]);
      const accessory = pick(["flower", "mushroom", "leaf"]);
      const cheeks = Math.random() > 0.25;
      const freckles = Math.random() > 0.35;
      const extras = accessory === "flower"
        ? `<g transform="translate(174 66)"><circle r="11" fill="#f7dfb3"/><circle cx="-11" cy="0" r="7" fill="#f3b4a7"/><circle cx="11" cy="0" r="7" fill="#f3b4a7"/><circle cx="0" cy="-11" r="7" fill="#f3b4a7"/><circle cx="0" cy="11" r="7" fill="#f3b4a7"/><circle r="5" fill="#d8a34d"/></g>`
        : accessory === "mushroom"
          ? `<g transform="translate(177 67)"><rect x="-4" y="0" width="8" height="15" rx="3" fill="#fff1d9"/><path d="M-17 4 Q0 -22 17 4Z" fill="#b85e4b"/><circle cx="-5" cy="-2" r="3" fill="#fff1d9"/><circle cx="7" cy="-3" r="2.5" fill="#fff1d9"/></g>`
          : `<path d="M169 78 Q169 48 195 42 Q195 68 169 78Z" fill="#71945c" stroke="#526c48" stroke-width="2"/><path d="M170 76 L190 50" stroke="#526c48" stroke-width="2"/>`;
      document.getElementById("portrait").innerHTML = `
        <title>Random cozy goblin with a woodland hat</title>
        <rect width="240" height="240" rx="17" fill="#e2e8cf"/>
        <circle cx="120" cy="116" r="95" fill="#d2dcc0"/>
        <path d="M0 213 Q60 180 120 210 T240 206 V240 H0Z" fill="#b3c4a1"/>
        <path d="M48 241 Q50 181 120 178 Q190 181 192 241Z" fill="${cloak}"/>
        <path d="M66 126 L25 100 Q24 137 74 150Z M174 126 L215 100 Q216 137 166 150Z" fill="${skin}" stroke="#607a56" stroke-width="2"/>
        <ellipse cx="120" cy="134" rx="63" ry="66" fill="${skin}" stroke="#607a56" stroke-width="2"/>
        ${cheeks ? `<ellipse cx="82" cy="149" rx="14" ry="8" fill="#d68c85" opacity=".55"/><ellipse cx="158" cy="149" rx="14" ry="8" fill="#d68c85" opacity=".55"/>` : ""}
        <ellipse cx="94" cy="130" rx="8" ry="11" fill="#fff9e9"/><ellipse cx="146" cy="130" rx="8" ry="11" fill="#fff9e9"/>
        <circle cx="96" cy="132" r="4.5" fill="${eye}"/><circle cx="144" cy="132" r="4.5" fill="${eye}"/>
        <path d="M120 138 l-7 16 q7 5 14 0Z" fill="#739266"/>
        <path d="M105 168 Q120 182 135 168" fill="none" stroke="#5d4b3e" stroke-width="3" stroke-linecap="round"/>
        ${freckles ? `<g fill="#6b8059"><circle cx="77" cy="142" r="2"/><circle cx="86" cy="145" r="2"/><circle cx="163" cy="142" r="2"/><circle cx="154" cy="145" r="2"/></g>` : ""}
        <path d="M42 100 Q68 68 99 32 Q118 5 134 28 Q158 61 196 100Z" fill="${hat}" stroke="#624e43" stroke-width="3"/>
        <ellipse cx="120" cy="101" rx="83" ry="13" fill="${hat}" stroke="#624e43" stroke-width="3"/>
        <path d="M74 87 Q119 96 168 86" stroke="#f2d6a5" stroke-width="6" fill="none"/>
        ${extras}
        <path d="M96 195 L120 214 L144 195" fill="none" stroke="#d7c6a0" stroke-width="5" stroke-linecap="round"/>
      `;
    }
    const button = document.getElementById("generate");
    button.addEventListener("click", () => {
      drawGoblin();
      document.getElementById("goblin-name").textContent = `${pick(firstNames)} ${pick(lastNames)}`;
      document.getElementById("job").textContent = pick(jobs);
      document.getElementById("item").textContent = pick(items);
      document.getElementById("personality").textContent = pick(personalities);
      document.getElementById("result").hidden = false;
      button.textContent = "Generate Again ↻";
    });
  </script>
</body>
</html>
